name: Docker Build and Push

on:
  workflow_dispatch:
  push:
    # FORK (ToHands): only the deploy branches build images. ArgoCD runs
    # dev-latest (develop), stg-latest (staging) and latest (main).
    branches:
      - develop
      - staging
      - main
    paths-ignore:
      # README and docs
      - "**/README*"
      - "**/readme*"
      - "**/*.md"
      - "**/docs/**"
      - "**/CHANGELOG*"
      - "**/LICENSE*"
      # SDKs (published separately)
      - "packages/sdks/**"
      # Public app (docs/marketing, not part of Docker deploy)
      - "apps/public/**"
      # Dev / tooling
      - "**/.vscode/**"
      - "**/.cursor/**"
      - "**/.env.example"
      - "**/.env.*.example"
      - "**/.gitignore"
      - "**/.eslintignore"
      - "**/.prettierignore"

# Read-only by default; the jobs that push images or tags widen it themselves.
permissions:
  contents: read

# A newer push to a branch supersedes the run still in flight.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # FORK (ToHands): images are ghcr.io/tohands-private-limited/openpanel-{api,dashboard}.
  repo_owner: "tohands-private-limited"

# Shape of a run: `check`, `test` and `build` start together; `smoke` boots
# what `build` produced, and `merge` tags the images once everything is green.
# FORK (ToHands): upstream's `settle` debounce and `version` release jobs are
# removed; every deploy branch is tagged by `merge`.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Formatting and import order only. `bun run lint` (the full rule set) still reports errors that need a human
      # decision, so it is not a gate yet; this half is green and catches drift today.
      - name: Check formatting
        run: bun run lint:format

      - name: Run TypeScript checks
        run: bun run typecheck

      # dependency-cruiser keeps the dissolved validation/constants/common/json packages from growing back. Run standalone,
      # not via `bun run check`, so a lint error cannot mask a dependency-boundary break.
      - name: Check dependency boundaries
        run: bun run check:deps

      # The self-hosting CLI keeps its own lockfile (it ships as a binary, not
      # as a workspace package), so it installs and tests on its own.
      - name: Test the self-hosting CLI
        working-directory: self-hosting/cli
        run: |
          bun install --frozen-lockfile
          bun test

  # packages/core is 200+ files run one process each (`--isolate`), which is
  # most of the suite's time, so it is split across runners with `--shard`;
  # every other workspace fits in one job. Each job has its own databases.
  test:
    name: test (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: core 1/3
            directory: packages/core
            command: bun run test --shard=1/3
          - suite: core 2/3
            directory: packages/core
            command: bun run test --shard=2/3
          - suite: core 3/3
            directory: packages/core
            command: bun run test --shard=3/3
          - suite: everything else
            directory: .
            command: bun run test:rest
            migrate: true
    services:
      postgres:
        image: postgres:16-alpine
        ports:
          # The host port is what test/databases.ts pins, not a free choice.
          - 23432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 23379:6379
        options: >-
          --health-cmd "redis-cli ping || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:26.1.3.52
        ports:
          - 23123:8123
        env:
          CLICKHOUSE_DB: openpanel
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: ""
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Exercises the real migration runners, which the suite does not: tests apply
      # the flat test/clickhouse-schema.sql, so `migrate:deploy` is the only place
      # Prisma's migrate and the ClickHouse code-migrations actually run. Uses its
      # own databases, never the suite's `openpanel_test`.
      - name: Migrate database
        if: matrix.migrate
        run: bun run migrate:deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:23432/postgres?schema=public
          DATABASE_URL_DIRECT: postgresql://postgres:postgres@localhost:23432/postgres?schema=public
          CLICKHOUSE_URL: http://localhost:23123/openpanel
          SELF_HOSTED: "true"

      # No env block, deliberately. Every workspace's test preload pins DATABASE_URL / CLICKHOUSE_URL / REDIS_URL itself and
      # creates and migrates the isolated `openpanel_test` databases (test/bun-preload.ts, packages/core/test/preload.ts).
      # Env set here would be silently overwritten.
      - name: Run tests
        working-directory: ${{ matrix.directory }}
        run: ${{ matrix.command }}

  # Pushes by digest only; nothing gets a pullable tag until `merge`. That is
  # why it can start alongside `check` and `test` instead of after them.
  # FORK (ToHands): every deploy branch builds both platforms, because each
  # one ships to a cluster.
  build:
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app: [api, dashboard]
        platform: [linux/amd64, linux/arm64]
        include:
          - app: api
            dockerfile: apps/api/Dockerfile
            build_args: DATABASE_URL=postgresql://dummy:dummy@localhost:5432/dummy
          - app: dashboard
            dockerfile: apps/start/Dockerfile
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.TOHANDS_GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      # The layer cache lives in the registry, next to the image, not in the
      # Actions cache: the install layers alone are ~1 GB per build, which
      # kept the 10 GB Actions cache full and evicting, and exporting them
      # there took longer than the build itself. zstd because that 1 GB is
      # compressed on every export and decompressed on every import, and
      # with gzip that took over a minute each way; the image itself keeps
      # its default layers.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          cache-from: type=registry,ref=ghcr.io/${{ env.repo_owner }}/openpanel-${{ matrix.app }}:buildcache-${{ env.PLATFORM_PAIR }}
          cache-to: type=registry,ref=ghcr.io/${{ env.repo_owner }}/openpanel-${{ matrix.app }}:buildcache-${{ env.PLATFORM_PAIR }},mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd
          outputs: type=image,name=ghcr.io/${{ env.repo_owner }}/openpanel-${{ matrix.app }},push-by-digest=true,name-canonical=true,push=true
          build-args: ${{ matrix.build_args }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.app }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Boots the images this run produced and asserts they actually serve traffic.
  # Gates `merge`, so a broken image never gets a pullable tag.
  smoke:
    permissions:
      packages: read
      contents: read
    needs: [build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.TOHANDS_GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      # build pushed by digest but has not tagged anything yet, so pull the
      # exact amd64 digests this run produced.
      - name: Download amd64 digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/smoke-digests
          pattern: digests-*-linux-amd64

      - name: Resolve images
        run: |
          set -euo pipefail
          for app in api dashboard; do
            dir="/tmp/smoke-digests/digests-${app}-linux-amd64"
            digest="$(ls "$dir" | head -1)"
            if [ -z "$digest" ]; then
              echo "::error::no digest artifact for $app"
              exit 1
            fi
            image="ghcr.io/${{ env.repo_owner }}/openpanel-${app}@sha256:${digest}"
            echo "$app -> $image"
            echo "OP_$(echo "$app" | tr '[:lower:]' '[:upper:]')_IMAGE=$image" >> "$GITHUB_ENV"
          done

      - name: Smoke test the stack
        run: .github/smoke/smoke.sh

      - name: Tear down
        if: always()
        run: docker compose -f .github/smoke/docker-compose.yml down -v || true

  # FORK (ToHands): tags each deploy branch's images with its env tag
  # (dev-latest / stg-latest / latest) and `<env tag>-<short sha>`.
  merge:
    permissions:
      packages: write
      contents: read
    needs: [check, test, build, smoke]
    if: ${{ contains(fromJSON('["refs/heads/develop","refs/heads/staging","refs/heads/main"]'), github.ref) && !cancelled() && needs.check.result == 'success' && needs.test.result == 'success' && needs.smoke.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        app: [api, dashboard]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.app }}-*
          merge-multiple: true

      - name: Generate tags
        id: tags
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-4)
          case "${{ github.ref_name }}" in
            develop) ENV_TAG="dev-latest" ;;
            staging) ENV_TAG="stg-latest" ;;
            main)    ENV_TAG="latest" ;;
          esac
          echo "env_tag=$ENV_TAG" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.TOHANDS_GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ env.repo_owner }}/openpanel-${{ matrix.app }}:${{ steps.tags.outputs.env_tag }} \
            -t ghcr.io/${{ env.repo_owner }}/openpanel-${{ matrix.app }}:${{ steps.tags.outputs.env_tag }}-${{ steps.tags.outputs.short_sha }} \
            $(printf 'ghcr.io/${{ env.repo_owner }}/openpanel-${{ matrix.app }}@sha256:%s ' *)
